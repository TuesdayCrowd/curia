name: CI

# Phase 1 shipped with every gate passing and none of them running anywhere but a
# developer's machine. The documents describe several of these as continuously enforced --
# CS-3's committed lock files restored with --locked-mode, R11.9's replay-rebuild drill,
# R14.6's "divergences are release blockers" -- which until now meant "enforced when someone
# remembers". This workflow is what makes those statements true.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same PR makes the first run's answer irrelevant, not merely late.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheapest gate, no toolchain: the cross-reference checks that found four real defects on
  # their first run. Kept a separate job so a specification-only PR gets its answer in
  # seconds rather than behind a Postgres container.
  spec:
    name: Specification checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check-spec
        run: python3 tools/spec-checks/check-spec.py

      # A gate that has never failed has not been shown to work. This breaks each of
      # check-spec's four checks against a temporary copy of the three documents and
      # asserts on the message printed, so a check that silently stops firing is caught
      # here rather than by the defect it was supposed to catch.
      - name: falsify check-spec
        run: python3 tools/spec-checks/falsify-spec-checks.py

      # The same rule for the two scripts that keep the Api legs honest: the leg checker's
      # judgements (a test in two legs, in none, a leg that lists nothing, a TRX that is missing
      # or failed) and preflight's reading of a matrix or `needs` job. Both need no toolchain.
      - name: falsify api-legs
        run: python3 tools/ci/falsify-api-legs.py

      - name: falsify preflight
        run: python3 tools/preflight/falsify-preflight.py

  # The core job: everything but the Api suite. The Api suite is no longer a step here; it is
  # the `api` job below, in legs on their own runners, and `gate` joins the two under the name
  # the ruleset requires. This job still checks that every Api class is in exactly one leg.
  dotnet:
    name: .NET — core (build, architecture, all but Api)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Curia.Infrastructure.Tests provisions a throwaway database and a restricted role per
    # run, so it needs an admin-capable server rather than a pre-made database. It fails
    # loudly when none is reachable instead of skipping -- a green suite that quietly ran
    # nothing is the exact failure R11.9 exists to prevent -- so this service is load-bearing,
    # not a convenience.
    services:
      postgres:
        # pgvector's own image, not postgres:18: db/0003 creates the vector extension and the
        # Infrastructure suite fails at provisioning without it, on purpose (see that migration).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Phase 1's exit criterion is that an *independently written* verifier confirms authorship
      # offline, and Curia.Api.Tests executes it by running curia-testis against a served post.
      # That test fails rather than skips without the binary -- a skipped exit-criterion test
      # reports the same green as a passing one -- so the Rust toolchain belongs in this job too.
      - name: Set up Rust (for the independent verifier)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/curia-testis

      - name: Build the independent verifier
        run: cargo build --locked --bin curia-testis
        working-directory: rust/curia-testis

      # Errata G65 (R11.91, R14.13): the embedding model, fetched by digest and cached on the
      # manifest's content. Curia.Embedding.Tests runs the real model and fails, never skips,
      # without it. The cache is a uses: step, which tools/preflight does not run locally.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/curia-model
          key: curia-model-${{ hashFiles('models/bge-small-en-v1.5/manifest.json') }}

      - name: Fetch the embedding model
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/model/fetch-model.py --out "$RUNNER_TEMP/curia-model"

      # CS-3: lock files are committed, and CI restores against them. Without --locked-mode a
      # drifted lock file restores anyway and the commitment is decorative.
      - name: Restore (locked)
        run: dotnet restore Curia.sln --locked-mode

      # Directory.Build.props sets TreatWarningsAsErrors (CS-2); --no-restore keeps the locked
      # restore above the only one that runs.
      - name: Build
        run: dotnet build Curia.sln --no-restore --configuration Release

      # Every Api test class runs in exactly one leg. This lists the whole assembly and each leg's
      # filter with the test runner's own discovery and compares them, so a leg that selects nothing
      # or two legs that select the same test fail here, in minutes, and not as a silent gap.
      - name: "Api legs: every class in exactly one leg"
        run: python3 tools/ci/api-legs.py check --out "$RUNNER_TEMP/api-partition.json"

      - name: Upload the Api partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-partition
          path: ${{ runner.temp }}/api-partition.json
          if-no-files-found: error

      # R10.69 (A3 Step 5): the screening cost tests alone, so the stop reads the screener and not
      # eleven test hosts on four cores; the timings file comes from this step only.
      - name: Screening cost, alone (R10.69)
        if: ${{ !cancelled() }}
        env:
          CURIA_SCREEN_TIMINGS: ${{ runner.temp }}/screen-timings.tsv
          CURIA_SCREEN_SCALING: ${{ runner.temp }}/screen-scaling.tsv
        run: |
          dotnet test tests/Curia.Domain.Tests --no-build --configuration Release --filter "FullyQualifiedName~ScreeningCostTests"
          test "$(wc -l < "$CURIA_SCREEN_TIMINGS")" -eq 28
          test "$(wc -l < "$CURIA_SCREEN_SCALING")" -eq 28

      # Register item 320: OAS30m (the operator-act fold's cost, errata G70) is judged here, alone, never in the
      # all-but-Api step: its collection is serial inside one assembly, but that step runs every test host at once,
      # so a wall-clock bound there measures the runner (#160's CI failed it at 25.6 ms against 22.6 ms; every
      # isolated run passed). A filter that matches nothing exits 0, so the TRX must hold exactly one result.
      - name: Operator-act fold cost, alone (OAS30m)
        if: ${{ !cancelled() }}
        run: |
          dotnet test tests/Curia.Application.Tests --no-build --configuration Release --filter "FullyQualifiedName~OperatorActCostTests" --logger "trx;LogFileName=oas30m.trx" --results-directory "${{ runner.temp }}/oas30m"
          test "$(grep -o '<UnitTestResult ' "${{ runner.temp }}/oas30m/oas30m.trx" | wc -l)" -eq 1

      # D16, decided as option 1: the architecture rules run in Debug as well. NetArchTest reads IL,
      # and IL differs by configuration: a seven-case string switch in Curia.Domain fails CS-7 in
      # Debug and passes it in Release, so this job, running Release alone, was green while every
      # developer's Debug run was red. The whole solution is built in Debug first: CS-15 reads
      # Curia.Domain.Tests and Curia.Application.Tests from their Debug output, and neither is a
      # reference of the architecture project, so `dotnet test` on that project alone never builds them.
      - name: Architecture rules (Debug)
        run: |
          dotnet build Curia.sln --no-restore --configuration Debug
          dotnet test tests/Curia.Architecture.Tests --no-build --configuration Debug

      - name: Test (all but Api)
        env:
          CURIA_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
          CURIA_TESTIS_BIN: ${{ github.workspace }}/rust/curia-testis/target/debug/curia-testis
          CURIA_EMBEDDING_MODEL_DIR: ${{ runner.temp }}/curia-model
        # R10.69's cost class is judged only in the isolated step above, never here: elapsed time
        # inside eleven test hosts on four cores measures the runner's load, not the screener's work.
        # Run 37575114798 read zero-width-space ScreenEnvelope at the cap 309 ms isolated and at least
        # 1,010 ms here, a ratio of 24.8 to 32 KiB. This step's "!~" and the isolated step's "~" over
        # the same name are what make the split exact.
        run: dotnet test Curia.sln --no-build --configuration Release --filter "FullyQualifiedName!~ScreeningCostTests&FullyQualifiedName!~OperatorActCostTests&FullyQualifiedName!~Curia.Api.Tests"

      - name: Upload the screening timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-timings
          path: ${{ runner.temp }}/screen-timings.tsv
          if-no-files-found: error

      - name: Upload the screening scaling ratios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-scaling
          path: ${{ runner.temp }}/screen-scaling.tsv
          if-no-files-found: error

  # The Api suite, in legs. A leg is a set of whole test classes, defined once in
  # tools/ci/api-legs.json; this job asks for its filter by name. `rest` is the complement of the
  # named legs, so a class renamed out of one runs in `rest` and not in no leg, and the core job's
  # check proves each class is in exactly one. Each leg rebuilds the Api test project's closure on
  # its own runner and fetches no embedding model: the suite replaces the embedder through
  # ForumFixture's one door.
  api:
    name: .NET — Api (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: fuzz
            timeout: 150
          - leg: bursts
            timeout: 90
          - leg: rest
            timeout: 90

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Rust (for the independent verifier)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/curia-testis

      - name: Build the independent verifier
        run: cargo build --locked --bin curia-testis
        working-directory: rust/curia-testis

      - name: Restore (locked)
        run: dotnet restore tests/Curia.Api.Tests --locked-mode

      - name: Build
        run: dotnet build tests/Curia.Api.Tests --no-restore --configuration Release

      - name: Test (Api, ${{ matrix.leg }})
        env:
          CURIA_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
          CURIA_TESTIS_BIN: ${{ github.workspace }}/rust/curia-testis/target/debug/curia-testis
        run: |
          mkdir -p "$RUNNER_TEMP/trx"
          # R14.10's closed pass writes the elapsed time of every send, by row and send index, and
          # the slowest per route, so growth from folding shows as a slope (spec §4.10). Only the fuzz
          # leg runs it, and the variable is exported here, not set in env:, because an empty value
          # is the empty string and the fuzzer's file append rejects it.
          if [ "${{ matrix.leg }}" = fuzz ]; then export CURIA_FUZZ_TIMINGS="$RUNNER_TEMP/fuzz-timings.tsv"; fi
          dotnet test tests/Curia.Api.Tests --no-build --configuration Release --filter "$(python3 tools/ci/api-legs.py filter ${{ matrix.leg }})" --logger "trx;LogFileName=$RUNNER_TEMP/trx/${{ matrix.leg }}.trx"

      - name: Upload the TRX
        if: always() && matrix.leg != 'rest'
        uses: actions/upload-artifact@v4
        with:
          name: api-trx-${{ matrix.leg }}
          path: ${{ runner.temp }}/trx/*.trx
          if-no-files-found: error

      - name: Upload the fuzzer's timings
        if: always() && matrix.leg == 'fuzz'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-timings
          path: ${{ runner.temp }}/fuzz-timings.tsv
          if-no-files-found: warn

  # The required check. The ruleset `protect-main` requires the context named below, and it must
  # keep that name, so no ruleset edit is needed and a name left alone cannot drift from it.
  # It is `always()` because a job skipped for a failed `needs` is reported skipped, and a skipped
  # required check does not block a merge: without it, a red leg could leave this check skipped and
  # the PR mergeable. With it, this job runs after a failure and fails itself.
  gate:
    name: .NET — build and test
    needs: [dotnet, api]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Core and every Api leg succeeded
        env:
          CORE: ${{ needs.dotnet.result }}
          API: ${{ needs.api.result }}
        run: |
          echo "core job: $CORE"
          echo "api legs: $API"
          if [ "$CORE" != success ] || [ "$API" != success ]; then exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: api-partition
          path: ${{ runner.temp }}/accounting/partition

      - uses: actions/download-artifact@v4
        with:
          pattern: api-trx-*
          merge-multiple: true
          path: ${{ runner.temp }}/accounting/trx

      # Each leg ran what the partition lists, class by class, and every result passed.
      - name: Account for every Api test
        run: python3 tools/ci/api-legs.py account --partition "$RUNNER_TEMP/accounting/partition/api-partition.json" --trx "$RUNNER_TEMP/accounting/trx"

  rust:
    name: Rust — curia-testis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/curia-testis
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/curia-testis

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The independent verifier is the evidence behind Phase 1's exit criterion. Its 244
      # tests across 19 binaries are not a secondary suite.
      #
      # Note what the two steps above are: `cargo fmt --check` and `cargo clippy -- -D warnings`
      # ran here and were not in the command CLAUDE.md gave a developer, which was `cargo test`
      # alone. That was D16's shape in the other language -- CI and the developer running
      # different command sets over the same tree -- and it cost one red run, on 2026-09-09.
      # CLAUDE.md has listed all three since.
      - name: Test
        run: cargo test --locked

  # R14.6 makes a divergence between the two implementations a release blocker. Until now
  # nothing looked for one: compare.mjs existed, worked, and ran nowhere, so every divergence
  # this project has found was found by someone remembering to run it by hand -- and the last
  # four sat undetected long enough to need an erratum (Part G) before they could be fixed.
  #
  # This job was deliberately not added earlier. It would have gone red, because two known
  # string-cap divergences were carried in the harness on purpose while R6.39's reading was
  # genuinely undecided. G1 decided it and Curia.Canon now follows, so the run is green and the
  # gate is worth having. If it goes red, that is the requirement working: do not add an
  # expected-divergence baseline to quiet it without recording why.
  differential:
    name: Differential — C# vs curia-testis vs oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/curia-testis

      # Both endpoints are built by name rather than left to the harness's own fallback, so a
      # build failure is attributed to the implementation that failed instead of surfacing as
      # "endpoint not built" from the comparison step.
      - name: Build the C# differential endpoint
        run: dotnet build tools/Curia.Differential/Curia.Differential.csproj -c Release

      - name: Build the curia-testis differential endpoint
        run: cargo build --locked --release --bin curia-differential
        working-directory: rust/curia-testis

      # The default seed is fixed, so a red run here reproduces exactly with the same command
      # locally. The corpus reaches ~2 GB on disk (single lines legitimately approach the
      # 256 KiB string cap), which is why it goes under RUNNER_TEMP and is never uploaded --
      # only the report is, and only when there is something to read in it.
      - name: Compare
        run: >-
          node tools/differential-oracle/compare.mjs
          --workdir "$RUNNER_TEMP/differential"
          --report "$RUNNER_TEMP/DIVERGENCES.md"
          --fail-on-divergence

      - name: Upload the divergence report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: divergence-report
          path: ${{ runner.temp }}/DIVERGENCES.md
          if-no-files-found: warn
