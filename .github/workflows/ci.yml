name: CI

# Phase 1 shipped with every gate passing and none of them running anywhere but a
# developer's machine. The documents describe several of these as continuously enforced --
# CS-3's committed lock files restored with --locked-mode, R11.9's replay-rebuild drill,
# R14.6's "divergences are release blockers" -- which until now meant "enforced when someone
# remembers". This workflow is what makes those statements true.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same PR makes the first run's answer irrelevant, not merely late.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheapest gate, no toolchain: the cross-reference checks that found four real defects on
  # their first run. Kept a separate job so a specification-only PR gets its answer in
  # seconds rather than behind a Postgres container.
  spec:
    name: Specification checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check-spec
        run: python3 tools/spec-checks/check-spec.py

      # A gate that has never failed has not been shown to work. This breaks each of
      # check-spec's four checks against a temporary copy of the three documents and
      # asserts on the message printed, so a check that silently stops firing is caught
      # here rather than by the defect it was supposed to catch.
      - name: falsify check-spec
        run: python3 tools/spec-checks/falsify-spec-checks.py

  dotnet:
    name: .NET — build and test
    runs-on: ubuntu-latest

    # Curia.Infrastructure.Tests provisions a throwaway database and a restricted role per
    # run, so it needs an admin-capable server rather than a pre-made database. It fails
    # loudly when none is reachable instead of skipping -- a green suite that quietly ran
    # nothing is the exact failure R11.9 exists to prevent -- so this service is load-bearing,
    # not a convenience.
    services:
      postgres:
        # pgvector's own image, not postgres:18: db/0003 creates the vector extension and the
        # Infrastructure suite fails at provisioning without it, on purpose (see that migration).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Phase 1's exit criterion is that an *independently written* verifier confirms authorship
      # offline, and Curia.Api.Tests executes it by running curia-testis against a served post.
      # That test fails rather than skips without the binary -- a skipped exit-criterion test
      # reports the same green as a passing one -- so the Rust toolchain belongs in this job too.
      - name: Set up Rust (for the independent verifier)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/curia-testis

      - name: Build the independent verifier
        run: cargo build --locked --bin curia-testis
        working-directory: rust/curia-testis

      # CS-3: lock files are committed, and CI restores against them. Without --locked-mode a
      # drifted lock file restores anyway and the commitment is decorative.
      - name: Restore (locked)
        run: dotnet restore Curia.sln --locked-mode

      # Directory.Build.props sets TreatWarningsAsErrors (CS-2); --no-restore keeps the locked
      # restore above the only one that runs.
      - name: Build
        run: dotnet build Curia.sln --no-restore --configuration Release

      - name: Test
        env:
          CURIA_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
          CURIA_TESTIS_BIN: ${{ github.workspace }}/rust/curia-testis/target/debug/curia-testis
        run: dotnet test Curia.sln --no-build --configuration Release

  rust:
    name: Rust — curia-testis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/curia-testis
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/curia-testis

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The independent verifier is the evidence behind Phase 1's exit criterion. Its 168
      # tests across 12 binaries are not a secondary suite.
      - name: Test
        run: cargo test --locked

  # R14.6 makes a divergence between the two implementations a release blocker. Until now
  # nothing looked for one: compare.mjs existed, worked, and ran nowhere, so every divergence
  # this project has found was found by someone remembering to run it by hand -- and the last
  # four sat undetected long enough to need an erratum (Part G) before they could be fixed.
  #
  # This job was deliberately not added earlier. It would have gone red, because two known
  # string-cap divergences were carried in the harness on purpose while R6.39's reading was
  # genuinely undecided. G1 decided it and Curia.Canon now follows, so the run is green and the
  # gate is worth having. If it goes red, that is the requirement working: do not add an
  # expected-divergence baseline to quiet it without recording why.
  differential:
    name: Differential — C# vs curia-testis vs oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/curia-testis

      # Both endpoints are built by name rather than left to the harness's own fallback, so a
      # build failure is attributed to the implementation that failed instead of surfacing as
      # "endpoint not built" from the comparison step.
      - name: Build the C# differential endpoint
        run: dotnet build tools/Curia.Differential/Curia.Differential.csproj -c Release

      - name: Build the curia-testis differential endpoint
        run: cargo build --locked --release --bin curia-differential
        working-directory: rust/curia-testis

      # The default seed is fixed, so a red run here reproduces exactly with the same command
      # locally. The corpus reaches ~2 GB on disk (single lines legitimately approach the
      # 256 KiB string cap), which is why it goes under RUNNER_TEMP and is never uploaded --
      # only the report is, and only when there is something to read in it.
      - name: Compare
        run: >-
          node tools/differential-oracle/compare.mjs
          --workdir "$RUNNER_TEMP/differential"
          --report "$RUNNER_TEMP/DIVERGENCES.md"
          --fail-on-divergence

      - name: Upload the divergence report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: divergence-report
          path: ${{ runner.temp }}/DIVERGENCES.md
          if-no-files-found: warn
