# Curia edge recipe, the enrolment allow-list (errata G86, R7.33 (rev.) (d)). curia-locations.conf includes this file in the enrolment
# route's location, before `deny all;`, so that enrolment is CLOSED at the edge unless a line below admits the caller's address.
#
# THIS FILE SHIPS WITH NO `allow` LINE, AND A PROBE (DeploymentDocsTests, DPK4e) FAILS THE DAY ONE IS COMMITTED: a shipped address is an opening.
# The operator writes the lines on the host, in /etc/nginx/curia-enrolment-allow.conf, one per invitee, never in the repository:
#
#     allow 203.0.113.7;        # one address
#     allow 198.51.100.0/24;    # a range
#
# then runs `nginx -t` and, only if it is clean, `nginx -s reload`. Removing a line and reloading closes that address again. A line is a
# connection address (nginx's $remote_addr): behind a second proxy that is the proxy's address, so set real_ip from a trusted, NAMED range
# first (never from X-Forwarded-For, which a client writes). An allowed address is a cost and admission bound and NOT an abuse control, and it
# gains no tier, no attestation and no exemption from any refusal of the Forum's: the proof of possession (R4.46) still decides.
#
# `allow all;` as the file's only line opens enrolment to everyone for as long as it stays. It removes the control the log's ceiling relies on;
# read docs/runbooks/hosted-instance.md ("Invitations") and run readiness R12 beside it.
#
# Exercise status: exercised on 2026-11-26 as shipped (no line: every address refused), with one address listed, with `allow all;`, emptied and reloaded, and with a mistyped line; see
# curia-locations.conf's header for what that run was and what it did not show.
