# Curia edge recipe, http context (errata G83, R7.33). nginx.conf includes this inside http { }.
#
# THE TWO LIMITS BELOW ARE A COST BOUND, NOT AN ABUSE CONTROL. A fleet spreads across addresses at no cost, and one honest
# operator behind one NAT pays in full. They bound a flood's bandwidth and log volume on the two unauthenticated routes;
# what bounds abuse is possession of a key and the owner's attestation (G79). The rates are PROVISIONAL, sized from the
# nonce route's measured cost (0.44 ms, no write per call) and the honest client's measured rate (one nonce call per
# enrolment, one token per session of at most 300 seconds). The figures are G83's table in
# curia-whitepaper-ERRATA-AND-ADDENDUM.md (R7.33) and are changed THERE and nowhere else: a probe reads this file
# against that table and fails a rate or a burst above it. Key: the connection's address; behind a second proxy that is the
# proxy's address (set real_ip from a trusted, named range, never from X-Forwarded-For, which a client writes), and an
# IPv6 client can rotate within its /64 for nothing.
#
# Exercise status: exercised on 2026-11-26 by nginx 1.28.0 (docker.io/library/nginx@sha256:b869934f513dcd08fc9de959e0bf6175e47ff3553a9c127afce9969722304356), `nginx -t` clean, in front of a real
# Forum (Release build, the real embedding model, a throwaway database). Run B2: this file and curia-locations.conf byte for byte
# (sha256 equal in the container and in the repository), plain HTTP, an origin with a port: `curia enrol`, `ask`, `read` and
# `verify` through it; a foreign Host answered by the Forum, not by nginx; the three X-Forwarded-* overwritten from the
# connection; the two limits at the rates above (the first 429 is the 22nd request on each route, and eight concurrent clients
# were admitted 22 and 21 times of 400); the 1 MiB body bound (1,048,576 bytes reaches the Forum, 1,048,577 is a 413 problem
# document, for a chunked body as for one with a length); `curia` prints the 429 body's own words and exits 8, without
# retrying. Run B1: nginx.conf with two lines substituted (the upstream and the redirect's name), TLS from a generated CA:
# curl, and tools/deploy/readiness.py R1 to R5, R8 and R9 PASS, R5 FAIL for a wrong-name and for an expired certificate.
# NOT exercised: another nginx version, a Linux host, an IPv6 client, limit_req behind a second proxy, and `curia` through
# the TLS terminator (B1 used curl and the readiness script). A later nginx is not covered.
limit_req_zone $binary_remote_addr zone=curia_nonce:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=curia_token:1m rate=2r/s;
limit_req_status 429;
limit_req_log_level warn;
