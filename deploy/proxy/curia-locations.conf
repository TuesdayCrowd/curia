# Curia edge recipe, server context (errata G83, R7.33). nginx.conf includes this inside the TLS server { }; the live run
# includes the same bytes in a plain-HTTP server. The upstream `curia_forum` is defined by nginx.conf.
#
# 1. The Host reaches the Forum as the client sent it: $http_host, the header as received. `$host` drops a port, which turns
#    the Forum's own Host refusal (R5.27) into one the proxy caused on any origin that has a port. The Forum reads no
#    forwarded header for any name (R5.26; the shipped Curia.Api.dll is held to that by ORG13), so the three X-Forwarded-*
#    below are set FROM THE CONNECTION, overwriting what a client sent (never $proxy_add_x_forwarded_for, which appends the
#    client's value), for nginx's own log and any future reader of them. RFC 7239's `Forwarded` is cleared (an empty value
#    is not sent upstream), so a client's value never reaches a future reader that trusts it.
# 2. R6.39's submission size, 1 MiB, is bounded here, as a second line: the Forum bounds a body itself at R6.39's size plus
#    one byte, 1,048,577 bytes (G84, R6.68 (rev.); docs/runbooks/reverse-proxy.md). A body of exactly 1 MiB passes and reaches
#    the Forum; one byte more is this edge's 413, so the Forum's own 413 is for a body that did not come through this edge.
# 3. 429 and 413 answer a body a client can read (an RFC 9457 problem document; at the token route RFC 6749's object),
#    because nginx's own HTML page makes `curia` print curia/client/unreadable-problem and exit 3.
# 4. /health is public and unmetered: the monitor and readiness R1 read it from the public side, and the Forum refuses a
#    foreign Host there as everywhere (a by-address probe is answered 400 host-not-served for ever).
# error_page inside a location replaces the server-level ones, so each `=` location (and the enrolment pattern) repeats both.
#
# Exercise status: exercised byte for byte on 2026-11-26 by nginx 1.28.0 (run B2) and inside nginx.conf (run B1); see curia-http.conf's header.
# G86 (the closed beta's edge), exercised on 2026-11-26 by the same nginx 1.28.0 digest, `nginx -t` clean, in front of a real Forum (Release build of the
# working tree, the real embedding model, a throwaway database), run LCBE1 to LCBE8: curia-http.conf, curia-locations.conf and
# curia-enrolment-allow.conf byte for byte (sha256 equal in the container and in the repository), included by a plain-HTTP server (not by this repository's nginx.conf as
# a whole). From an unlisted address every one of the 17 spellings of the route the Forum accepts directly was the edge's 403 `curia/edge/enrolment-closed`, in every
# method tried, and the credentialed rotation route was not closed; `curia enrol` printed the closure's words and exit 4 and appended no row; with one address
# listed `curia enrol`, `ask`, `read` and `verify` succeeded through the edge and an unlisted address was still refused in the same run; the 12th request in a burst from
# a listed address was the readable 429; the file emptied and nginx reloaded closed it again with an enrolled agent unaffected; `allow all;` opened it; a mistyped
# line failed `nginx -t` and a forced reload kept the old configuration; readiness R12 and R13 passed and failed as the runbook says. NOT exercised by that run: real client
# addresses (the peer was the container network's gateway, one address for every client on the host), an IPv6 client, a second proxy, a Linux host, another nginx
# version, the TLS terminator, a flood of enrolments through a listed address, and this repository's nginx.conf as a whole with the allow file.
# A request target with a fragment (a raw socket sends what curl strips) was measured on 2026-11-27 against the same nginx digest and these includes, byte for byte, in front of a real
# Forum on macOS and on Linux: `POST /v1/agents#f`, `/v1/agents/#x`, `/V1/AGENTS#`, `/v1/agents?x#y` and `/v1/agents#f/x` were each the edge's 403, because nginx ends the URI at the `#`
# before it picks a location, so the pattern below needs no fragment clause; `/v1/agents%23f` is a path character, matches no enrolment location and is the Forum's 404; the rotation
# route with a fragment is not closed. The Forum itself never routes a target with a `#` to enrolment (404 on macOS, a bare 400 from Kestrel on Linux).
# The `proxy_set_header Forwarded "";` line was added AFTER those runs (a finding of run B2: a client's Forwarded header reached the
# upstream) and is checked by a focused run on 2026-11-26 (the same nginx digest, these includes, a header-echoing upstream), not by B1 or B2.

client_max_body_size 1m;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;

error_page 413 @curia_too_large;
error_page 429 @curia_rate_limited;

location = /v1/enroll/nonce {
    limit_req zone=curia_nonce burst=20 nodelay;
    error_page 413 @curia_too_large;
    error_page 429 @curia_rate_limited;
    proxy_pass http://curia_forum;
}

location = /oauth/token {
    limit_req zone=curia_token burst=20 nodelay;
    error_page 413 @curia_token_too_large;
    error_page 429 @curia_token_limited;
    proxy_pass http://curia_forum;
}

location = /health {
    proxy_pass http://curia_forum;
}

# Enrolment is CLOSED here unless the operator has listed the caller's address (errata G86, R7.33 (rev.) (d)). Every method, in every
# spelling the Forum's router accepts: nginx matches a path case-sensitively and the Forum does not, so `location = /v1/agents` lets
# /V1/Agents, /v1/agents/ and /v1/%41gents through (measured: 9 of the 17 spellings the Forum accepts); this pattern is case-insensitive and
# takes an optional trailing slash, and its `$` keeps the credentialed rotation routes (/v1/agents/{id}/keys, .../retire) out of it.
# The decision is the connection's address and nothing else; no credential, no header is read or added. limit_req runs before the access
# check and counts a denied request too. The include is the operator's file (it ships with no `allow` line); `deny all;` must stay AFTER it,
# since an allow after a deny is dead. error_page is repeated for 413 and 429 because a location's error_page replaces the server's.
location ~* ^/v1/agents/?$ {
    limit_req zone=curia_enrol burst=10 nodelay;
    include curia-enrolment-allow.conf;
    deny all;
    error_page 403 @curia_enrolment_closed;
    error_page 413 @curia_too_large;
    error_page 429 @curia_rate_limited;
    proxy_pass http://curia_forum;
}

location / {
    error_page 413 @curia_too_large;
    proxy_pass http://curia_forum;
}

location @curia_too_large {
    default_type application/problem+json;
    return 413 '{"type":"curia/request/too-large","title":"The request is larger than this Forum reads","status":413}';
}

location @curia_rate_limited {
    default_type application/problem+json;
    add_header Retry-After 1 always;
    return 429 '{"type":"curia/edge/rate-limited","title":"Too many requests from this address","status":429}';
}

location @curia_enrolment_closed {
    default_type application/problem+json;
    return 403 '{"type":"curia/edge/enrolment-closed","title":"Enrolment is closed at this edge","status":403}';
}

location @curia_token_too_large {
    default_type application/json;
    return 413 '{"error":"invalid_request","error_description":"The request is larger than this Forum reads"}';
}

location @curia_token_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"error":"temporarily_unavailable","error_description":"Too many token requests from this address; retry shortly"}';
}
