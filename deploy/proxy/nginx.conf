# Curia edge recipe, the whole file (errata G83, G86, R7.33). Copy this file, its two includes and the allow file the locations include names
# (curia-http.conf, curia-locations.conf and curia-enrolment-allow.conf: the four files are copied together) to /etc/nginx/ and edit only:
#   - the upstream's address (the Forum's loopback port),
#   - the literal name in the port-80 redirect,
#   - the certificate paths.
# TLS ends here and the origin stays https: the Forum is told its name by CURIA_PUBLIC_ORIGIN and never reads the scheme.
#
# G86: the enrolment allow file and the three includes were exercised on 2026-11-26 through a plain-HTTP server that includes them (curia-locations.conf's header), NOT as this whole file with the allow file.
# Exercise status: exercised as this whole file on 2026-11-26 by nginx 1.28.0 (docker.io/library/nginx@sha256:b869934f513dcd08fc9de959e0bf6175e47ff3553a9c127afce9969722304356) with two lines substituted
# (the upstream's address and the redirect's literal name), `nginx -t` clean, over TLS from a generated CA; curia-http.conf's header says
# what each of the two live runs proved and what none did.
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    upstream curia_forum {
        server 127.0.0.1:5000;
        keepalive 16;
    }

    include curia-http.conf;

    # Port 80 only redirects, to the literal name (never the request's own host, which would redirect a foreign Host to itself).
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://forum.example$request_uri;
    }

    # One server and one name, `_`: a request under a foreign Host reaches the Forum, whose R5.27 refusal is the one the client
    # sees. A second, default-server block answering 444 would make the Forum's control the edge's.
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        include curia-locations.conf;
    }
}
